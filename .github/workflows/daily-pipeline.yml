# Phase 5: scheduled ingest + vector index (same as `mf-pipeline` / `scripts/run_daily_pipeline.sh`).
# 10:00 India Standard Time (IST) == 04:30 UTC (IST has no DST). Keep cron in sync with
# `phase5/src/mf_pipeline/schedule.py` → GITHUB_ACTIONS_CRON_UTC.
# Data paths are gitignored; this job uploads an artifact with manifests + chunk audit for inspection.

name: Daily MF pipeline (Phase 5)

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

concurrency:
  group: mf-rag-daily-pipeline
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ingest-and-index:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Repository variable MF_PIPELINE_BROWSER=1 to use Playwright (slower, heavier).
      MF_PIPELINE_BROWSER: ${{ vars.MF_PIPELINE_BROWSER }}
      PYTHONPATH: ${{ github.workspace }}/phase1/src:${{ github.workspace }}/phase2/src:${{ github.workspace }}/phase3/src:${{ github.workspace }}/phase5/src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache Hugging Face hub
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-hub-${{ hashFiles('pyproject.toml') }}

      - name: Install Python dependencies
        run: |
          python -m pip install -U pip wheel
          pip install -e ".[vector]"

      - name: Install Playwright (optional)
        if: env.MF_PIPELINE_BROWSER == '1'
        run: |
          pip install -e ".[browser]"
          playwright install chromium

      - name: Run mf-pipeline (ingest + Chroma index)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=(--index-backend chroma)
          if [[ "${MF_PIPELINE_BROWSER:-}" == "1" ]]; then
            ARGS+=(--browser)
          fi
          python -m mf_pipeline "${ARGS[@]}"

      - name: Upload index metadata artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mf-index-meta-${{ github.run_id }}
          path: |
            data/manifests/*.json
            data/index/*/index_manifest.json
            data/index/*/chunks.jsonl
          if-no-files-found: warn
          retention-days: 14
